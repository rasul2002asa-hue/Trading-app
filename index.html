<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TradeLearn - Трейдинг</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <style>
        :root{--bg:#0a0e27;--bg-card:#1a1f3a;--bg-input:rgba(255,255,255,0.05);--border:rgba(255,255,255,0.08);--text:#fff;--text2:#e0e0f0;--text4:#8e8ea0;--accent:#6c5ce7;--accent2:#a29bfe;--green:#2ecc71;--red:#ff6b6b;--yellow:#f1c40f;--card-bg:rgba(255,255,255,0.03)}
        [data-theme="light"]{--bg:#f0f2f5;--bg-card:#fff;--bg-input:#f0f2f5;--border:#e0e0e0;--text:#1a1a2e;--text2:#2d2d3f;--text4:#7a7a8a;--card-bg:#fff}
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;justify-content:center;align-items:center}
        .app-container{max-width:430px;width:100%;min-height:100vh;background:var(--bg-card);padding:20px;display:flex;flex-direction:column}
        @media(min-width:431px){.app-container{min-height:auto;border-radius:32px;border:1px solid var(--border);margin:20px;max-height:90vh}}
        .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
        .logo{font-size:24px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .header-btns{display:flex;gap:8px}
        .icon-btn{width:40px;height:40px;background:rgba(108,92,231,0.15);border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;color:var(--text);font-size:18px}
        .balance-card{background:linear-gradient(135deg,var(--accent),#4a3fcf);border-radius:20px;padding:20px;margin-bottom:20px;cursor:pointer;color:#fff}
        .balance-amount{font-size:36px;font-weight:700}
        .balance-change{font-size:14px;color:var(--green)}
        .nav-menu{display:flex;gap:8px;margin-bottom:20px;background:rgba(255,255,255,0.03);padding:5px;border-radius:14px}
        .nav-item{flex:1;padding:12px;border-radius:10px;cursor:pointer;text-align:center;font-size:13px;color:var(--text4);background:0;border:0;font-family:inherit}
        .nav-item.active{background:rgba(108,92,231,0.2);color:var(--accent2);font-weight:600}
        .content-area{flex:1;overflow-y:auto}
        .section{display:none}
        .section.active{display:block}
        .section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
        .section-title{font-size:18px;font-weight:700;color:var(--text2)}
        .add-btn{width:40px;height:40px;background:linear-gradient(135deg,var(--accent),#4a3fcf);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;color:#fff;font-size:22px}
        .content-cards{display:flex;flex-direction:column;gap:12px}
        .card{background:var(--card-bg);border:1px solid var(--border);border-radius:16px;padding:18px;cursor:pointer}
        .card-icon{font-size:28px;margin-bottom:10px}
        .card-title{font-weight:600;font-size:16px;color:var(--text2)}
        .card-desc{font-size:13px;color:var(--text4)}
        .card-badge{position:absolute;top:14px;right:14px;background:rgba(108,92,231,0.2);color:var(--accent2);padding:4px 10px;border-radius:20px;font-size:11px}
        .card-lock{position:absolute;top:14px;right:14px;font-size:18px}
        .delete-btn{position:absolute;bottom:14px;right:14px;background:rgba(255,107,107,0.2);color:var(--red);border:none;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:14px}
        .profile-avatar{width:80px;height:80px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 14px;cursor:pointer}
        .profile-name{text-align:center;font-size:20px;font-weight:700;cursor:pointer;color:var(--text2);margin:8px 0}
        .profile-email{text-align:center;font-size:12px;color:var(--text4)}
        .premium-btn{display:inline-block;padding:10px 24px;border-radius:25px;font-weight:600;font-size:14px;cursor:pointer;border:none;font-family:inherit;background:linear-gradient(135deg,var(--yellow),#e67e22);color:#fff}
        .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
        .stat-item{background:var(--card-bg);border-radius:14px;padding:16px;text-align:center;border:1px solid var(--border)}
        .stat-value{font-size:22px;font-weight:700;color:var(--text2)}
        .stat-label{font-size:11px;color:var(--text4)}
        .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
        .modal-overlay.active{display:flex}
        .modal{background:var(--bg-card);border-radius:24px;padding:28px 24px;width:100%;max-width:400px;max-height:85vh;overflow-y:auto}
        .modal-title{font-size:20px;font-weight:700;margin-bottom:20px;text-align:center}
        .form-group{margin-bottom:16px}
        .form-label{display:block;font-size:13px;color:var(--text4);margin-bottom:6px}
        .form-input,.form-textarea{width:100%;padding:14px;background:var(--bg-input);border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:15px;font-family:inherit}
        .form-textarea{resize:vertical;min-height:80px}
        .btn-group{display:flex;gap:10px;margin-top:20px}
        .btn{flex:1;padding:14px;border-radius:14px;font-weight:600;font-size:15px;cursor:pointer;border:none;font-family:inherit}
        .btn-primary{background:linear-gradient(135deg,var(--accent),#4a3fcf);color:#fff}
        .btn-secondary{background:var(--bg-input);color:var(--text4);border:1px solid var(--border)}
        .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--bg-card);border:1px solid var(--accent);color:var(--text);padding:14px 24px;border-radius:30px;font-weight:500;font-size:14px;z-index:400;text-align:center;max-width:90vw;opacity:0;transition:opacity 0.3s}
        .toast.show{opacity:1}
        .hidden{display:none!important}
        .logout-btn{width:100%;padding:10px;background:rgba(255,107,107,0.15);color:var(--red);border:none;border-radius:10px;cursor:pointer;font-family:inherit;font-size:13px;margin-top:12px}
        .link-btn{background:none;border:none;color:var(--accent2);cursor:pointer;font-family:inherit;font-size:13px;text-decoration:underline;padding:4px}
    </style>
</head>
<body>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyCdhqu5ps4Pt4gypInldhEX1jzuEzqUoZc",
    authDomain: "tradelearn-app-b07ba.firebaseapp.com",
    projectId: "tradelearn-app-b07ba",
    storageBucket: "tradelearn-app-b07ba.firebasestorage.app",
    messagingSenderId: "672570295261",
    appId: "1:672570295261:web:cb7892d732ef9a0dcbac34"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
</script>

<!-- Окно регистрации/входа -->
<div class="modal-overlay active" id="authOverlay">
    <div class="modal">
        <div style="font-size:48px;text-align:center;margin-bottom:12px;">🚀</div>
        <div class="modal-title" id="authTitle">Регистрация</div>
        
        <div id="regForm">
            <div class="form-group"><label class="form-label">📧 Email</label><input type="email" class="form-input" id="regEmail" placeholder="your@email.com"></div>
            <div class="form-group"><label class="form-label">👤 Имя</label><input type="text" class="form-input" id="regName" placeholder="Ваше имя"></div>
            <div class="form-group"><label class="form-label">🔒 Пароль (мин. 6 символов)</label><input type="password" class="form-input" id="regPassword" placeholder="Пароль"></div>
            <button class="btn btn-primary" style="width:100%" onclick="register()">📧 Зарегистрироваться</button>
            <p style="text-align:center;margin-top:12px;font-size:13px;color:#8e8ea0">
                Есть аккаунт? <button class="link-btn" onclick="showLoginForm()">Войти</button>
            </p>
        </div>
        
        <div id="loginForm" style="display:none">
            <div class="form-group"><label class="form-label">📧 Email</label><input type="email" class="form-input" id="loginEmail" placeholder="your@email.com"></div>
            <div class="form-group"><label class="form-label">🔒 Пароль</label><input type="password" class="form-input" id="loginPassword" placeholder="Пароль"></div>
            <button class="btn btn-primary" style="width:100%" onclick="loginUser()">🔑 Войти</button>
            <p style="text-align:center;margin-top:12px;font-size:13px;color:#8e8ea0">
                Нет аккаунта? <button class="link-btn" onclick="showRegForm()">Зарегистрироваться</button>
            </p>
        </div>
        
        <div id="verifyWait" style="display:none;text-align:center">
            <div style="font-size:48px;margin-bottom:12px;">📧</div>
            <p style="color:#2ecc71;font-weight:600;">Письмо отправлено!</p>
            <p style="color:#8e8ea0;font-size:14px;margin:8px 0">На <b id="verifyEmailDisplay"></b></p>
            <button class="btn btn-primary" style="width:100%;margin-top:16px" onclick="checkVerified()">✅ Проверить подтверждение</button>
            <button class="btn btn-secondary" style="width:100%;margin-top:8px" onclick="showRegForm()">← Назад</button>
        </div>
    </div>
</div>

<!-- Приложение -->
<div class="app-container" id="appContainer" style="display:none">
    <div class="header">
        <div class="logo">TradeLearn</div>
        <div class="header-btns">
            <button class="icon-btn" onclick="toggleTheme()">🌓</button>
            <button class="icon-btn" onclick="showToast('Уведомлений пока нет')">🔔</button>
        </div>
    </div>
    <div class="balance-card" onclick="editBalance()">
        <div>Торговый баланс</div>
        <div class="balance-amount" id="balanceAmount">$1,000</div>
        <div class="balance-change" id="balanceChange">Начни торговать</div>
    </div>
    <nav class="nav-menu" id="navMenu">
        <button class="nav-item active" data-section="profile">👤 Профиль</button>
        <button class="nav-item" data-section="learning">📚 Обучение</button>
        <button class="nav-item" data-section="plan">📋 План</button>
    </nav>
    <div class="content-area">
        <div class="section active" id="profile-section">
            <div class="section-header"><div class="section-title">Профиль</div></div>
            <div class="profile-avatar" onclick="editAvatar()">🧑‍💻</div>
            <div class="profile-name" onclick="editProfileName()">Трейдер</div>
            <div class="profile-email" id="profileEmailDisplay"></div>
            <div style="text-align:center;margin:12px 0">
                <button class="premium-btn" onclick="openPremiumModal()">💎 Получить Премиум</button>
            </div>
            <div class="stats-grid">
                <div class="stat-item"><div class="stat-value">0</div><div class="stat-label">Сделок</div></div>
                <div class="stat-item"><div class="stat-value">0%</div><div class="stat-label">Успешных</div></div>
                <div class="stat-item"><div class="stat-value">$0</div><div class="stat-label">Прибыль</div></div>
                <div class="stat-item"><div class="stat-value">1</div><div class="stat-label">День</div></div>
            </div>
            <button class="logout-btn" onclick="logoutUser()">🚪 Выйти</button>
        </div>
        <div class="section" id="learning-section">
            <div class="section-header"><div class="section-title">Обучение</div></div>
            <div id="learningCards"><p style="text-align:center;color:#8e8ea0">Загрузка...</p></div>
        </div>
        <div class="section" id="plan-section">
            <div class="section-header"><div class="section-title">План</div><button class="add-btn" onclick="openPlanModal()">+</button></div>
            <div class="content-cards" id="planCards"></div>
        </div>
    </div>
</div>

<!-- Модалка плана -->
<div class="modal-overlay" id="planModal">
    <div class="modal">
        <div class="modal-title">Добавить план</div>
        <div class="form-group"><label class="form-label">Название</label><input type="text" class="form-input" id="planTitle"></div>
        <div class="form-group"><label class="form-label">Детали</label><textarea class="form-textarea" id="planDesc"></textarea></div>
        <div class="btn-group">
            <button class="btn btn-secondary" onclick="closePlanModal()">Отмена</button>
            <button class="btn btn-primary" onclick="addPlan()">Сохранить</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============ ДАННЫЕ ============
let appData = JSON.parse(localStorage.getItem('tradeLearnData')) || {profileName:'Трейдер',balance:'$1,000',balanceChange:'Начни торговать',plan:[],isPremium:false};
let currentTheme = 'dark';

auth.onAuthStateChanged(user => {
    if (user) {
        if (user.emailVerified) {
            document.getElementById('authOverlay').classList.remove('active');
            document.getElementById('appContainer').style.display = '';
            document.getElementById('profileEmailDisplay').textContent = user.email;
            loadAppData();
            loadLessons();
        } else {
            document.getElementById('authOverlay').classList.add('active');
            document.getElementById('appContainer').style.display = 'none';
            document.getElementById('regForm').style.display = 'none';
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('verifyWait').style.display = 'block';
            document.getElementById('verifyEmailDisplay').textContent = user.email;
        }
    } else {
        document.getElementById('authOverlay').classList.add('active');
        document.getElementById('appContainer').style.display = 'none';
        showRegForm();
    }
});

// ============ РЕГИСТРАЦИЯ / ВХОД ============
function register() {
    const email = document.getElementById('regEmail').value.trim();
    const name = document.getElementById('regName').value.trim();
    const password = document.getElementById('regPassword').value;
    if(!email||!name||password.length<6) return showToast('Заполните все поля');
    
    auth.createUserWithEmailAndPassword(email, password)
        .then(r => r.user.sendEmailVerification())
        .then(() => {
            appData.profileName = name;
            localStorage.setItem('tradeLearnData', JSON.stringify(appData));
            document.getElementById('regForm').style.display = 'none';
            document.getElementById('verifyWait').style.display = 'block';
            document.getElementById('verifyEmailDisplay').textContent = email;
            showToast('Письмо отправлено!');
        })
        .catch(e => showToast('Ошибка: ' + e.message));
}

function loginUser() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    if(!email||!password) return showToast('Заполните поля');
    
    auth.signInWithEmailAndPassword(email, password)
        .then(user => {
            if(!user.user.emailVerified) {
                user.user.sendEmailVerification();
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('verifyWait').style.display = 'block';
                document.getElementById('verifyEmailDisplay').textContent = email;
                showToast('Email не подтверждён. Новое письмо отправлено.');
            }
        })
        .catch(e => showToast('Ошибка: ' + e.message));
}

function checkVerified() {
    auth.currentUser.reload().then(() => {
        if(auth.currentUser.emailVerified) showToast('Email подтверждён!');
        else showToast('Ещё не подтверждён. Проверьте Спам.');
    });
}

function logoutUser() {
    auth.signOut();
}

function showLoginForm() {
    document.getElementById('regForm').style.display = 'none';
    document.getElementById('loginForm').style.display = 'block';
    document.getElementById('verifyWait').style.display = 'none';
    document.getElementById('authTitle').textContent = 'Вход';
}

function showRegForm() {
    document.getElementById('regForm').style.display = 'block';
    document.getElementById('loginForm').style.display = 'none';
    document.getElementById('verifyWait').style.display = 'none';
    document.getElementById('authTitle').textContent = 'Регистрация';
}

// ============ УРОКИ ============
function loadLessons() {
    const lessons = [
        {title:'Основы технического анализа',desc:'Свечные паттерны, тренды, индикаторы',badge:'Бесплатно',locked:false},
        {title:'Risk Management PRO',desc:'Управление рисками и депозитом',badge:'Бесплатно',locked:false},
        {title:'Психология трейдинга',desc:'Контроль эмоций и дисциплина',badge:'Премиум',locked:!appData.isPremium},
        {title:'Паттерны Price Action',desc:'Пин-бары, поглощения',badge:'Премиум',locked:!appData.isPremium}
    ];
    document.getElementById('learningCards').innerHTML = lessons.map(l=>`
        <div class="card" style="position:relative" onclick="${l.locked?'showToast(\'Требуется Премиум\')':'showToast(\'Открыт урок: '+l.title)'}">
            <div class="card-icon">📖</div>
            ${l.locked?'<div class="card-lock">🔒</div>':'<div class="card-badge">'+l.badge+'</div>'}
            <div class="card-title">${l.title}</div>
            <div class="card-desc">${l.locked?'🔒 Требуется Премиум':l.desc}</div>
        </div>
    `).join('');
}

// ============ ПЛАН ============
function openPlanModal() { document.getElementById('planModal').classList.add('active'); }
function closePlanModal() { document.getElementById('planModal').classList.remove('active'); }
function addPlan() {
    const title = document.getElementById('planTitle').value.trim();
    const desc = document.getElementById('planDesc').value.trim();
    if(!title||!desc) return showToast('Заполните поля');
    appData.plan.push({title,desc});
    localStorage.setItem('tradeLearnData', JSON.stringify(appData));
    closePlanModal();
    renderPlans();
    showToast('План добавлен!');
}
function renderPlans() {
    const c = document.getElementById('planCards');
    if(!appData.plan.length){c.innerHTML='<p style="text-align:center;color:#8e8ea0;padding:20px">Планов пока нет</p>';return;}
    c.innerHTML = appData.plan.map((p,i)=>`
        <div class="card" style="position:relative">
            <div class="card-title">📊 ${p.title}</div>
            <div class="card-desc">${p.desc}</div>
            <button class="delete-btn" onclick="deletePlan(${i})">✕</button>
        </div>
    `).join('');
}
function deletePlan(i){appData.plan.splice(i,1);localStorage.setItem('tradeLearnData',JSON.stringify(appData));renderPlans();}

// ============ ПРОФИЛЬ ============
function loadAppData() {
    document.getElementById('balanceAmount').textContent = appData.balance;
    document.getElementById('balanceChange').textContent = appData.balanceChange;
    renderPlans();
}
function editBalance() {
    const b = prompt('Сумма:', appData.balance);
    if(b){appData.balance=b;document.getElementById('balanceAmount').textContent=b;localStorage.setItem('tradeLearnData',JSON.stringify(appData));}
}
function editProfileName() {
    const n = prompt('Имя:', appData.profileName);
    if(n){appData.profileName=n;document.querySelector('.profile-name').textContent=n;localStorage.setItem('tradeLearnData',JSON.stringify(appData));}
}
function editAvatar() {
    const a = prompt('Эмодзи:', '🧑‍💻');
    if(a){document.querySelector('.profile-avatar').textContent=a;showToast('Аватар обновлён!');}
}
function openPremiumModal() {
    if(appData.isPremium){showToast('Уже Премиум!');return;}
    if(confirm('💎 Премиум доступ\n\nОплата: $49\n\nНажмите OK для имитации оплаты')) {
        appData.isPremium = true;
        localStorage.setItem('tradeLearnData', JSON.stringify(appData));
        loadLessons();
        showToast('Премиум активирован!');
    }
}

// ============ НАВИГАЦИЯ ============
document.querySelectorAll('.nav-item').forEach(item=>{
    item.addEventListener('click', ()=>{
        document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
        item.classList.add('active');
        document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
        document.getElementById(item.dataset.section+'-section').classList.add('active');
    });
});

// ============ ТЕМА ============
function toggleTheme() {
    currentTheme = currentTheme==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme', currentTheme);
}

// ============ TOAST ============
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 2000);
}
</script>
</body>
</html>
